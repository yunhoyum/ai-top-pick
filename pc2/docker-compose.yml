# =====================================================================
# PC2: ai-service, llm-server, tts-server  (시스템 아키텍처 11.1)
# 실행: pc2 폴더에서  docker compose up -d --build
# 변수: 같은 폴더의 .env (pc2/.env) 를 읽는다
# =====================================================================

x-fastapi-healthcheck: &fastapi-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:

  # ---------- AI 서비스 ----------
  ai-service:
    build:
      context: ../ai-service
    env_file: .env
    ports:
      # PC1의 main-api, celery-worker가 접속한다
      - "${AI_SERVICE_PORT}:8000"
    depends_on:
      tts-server:
        condition: service_healthy
      # llm-server를 추가하면 여기에도 넣는다
    healthcheck: *fastapi-healthcheck

  # ---------- TTS ----------
  tts-server:
    build:
      context: ../model-servers/tts-server
    environment:
      TTS_MODEL_DIR: /models/tts
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE}
      HF_HOME: /models/hf
    volumes:
      - tts-models:/models
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  tts-models:

  # ---------- LLM ----------
  # 서빙 도구(Ollama, llama.cpp server, vLLM)와 모델이 미정이라 주석으로 둔다
  # 도구를 정하면 image, command, 헬스 확인 경로, 포트를 채운다
  # llm-server:
  #   image: <서빙 도구 이미지>
  #   deploy: *gpu
  #   healthcheck:
  #     test: [...]

# x-gpu 앵커는 llm-server, tts-server에서 쓰려고 미리 둔다
