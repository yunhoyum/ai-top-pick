# =====================================================================
# PC2: ai-service, tts-server  (시스템 아키텍처 11.1)
# llm-server(Ollama)는 PC2에 직접 설치해 compose 밖에서 실행한다
# 실행: pc2 폴더에서  docker compose up -d --build
# 변수: 같은 폴더의 .env (pc2/.env) 를 읽는다
# =====================================================================

x-fastapi-healthcheck: &fastapi-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:

  # ---------- AI 서비스 ----------
  ai-service:
    build:
      context: ../ai-service
    env_file: .env
    ports:
      # PC1의 main-api, celery-worker가 접속한다
      - "${AI_SERVICE_PORT}:8000"
    depends_on:
      tts-server:
        condition: service_healthy
      # llm-server(Ollama)는 compose 밖이라 depends_on에 없다
    healthcheck: *fastapi-healthcheck

  # ---------- TTS ----------
  tts-server:
    build:
      context: ../model-servers/tts-server
    environment:
      TTS_MODEL_DIR: /models/tts
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE}
      HF_HOME: /models/hf
    volumes:
      - tts-models:/models
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ---------- LLM ----------
  # EXAONE 3.5 7.8B (IQ4_XS)는 PC2에 직접 설치한 Ollama가 서빙한다 (compose 밖)
  # ai-service는 host.docker.internal:11434로 접속한다 (pc2/.env의 LLM_URL)
  # 컨테이너로 옮길지는 통합 테스트 때 정한다. 옮기면 아래 형태로 채운다
  # llm-server:
  #   image: <서빙 도구 이미지>
  #   deploy: *gpu
  #   healthcheck:
  #     test: [...]

volumes:
  tts-models:

# x-gpu 앵커는 llm-server를 컨테이너로 옮길 때 쓰려고 미리 둔다
